{% load static %}
{# Apple as of iOS 26 still can't be an svg #}
<link rel="apple-touch-icon"
      href="{% static 'img/logo-maskable-180.webp' %}"
      sizes="180x180"
      type="image/webp" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Codex" />
{# Only default | black | black-translucent are valid here; a hex is ignored. #}
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
{# Chrome #}
<link rel="manifest"
      href="{% url 'pwa:manifest' %}"
      crossorigin="use-credentials" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="application-name" content="Codex" />
{# surface-light in frontend/src/plugins/vuetify.js; keep in sync with manifest.webmanifest. #}
<meta name="theme-color" content="#2A2A2A" />
<script async
        src="{% url 'pwa:serviceworker_register' %}"
        nonce="{{ csp_nonce }}"></script>
