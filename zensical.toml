[project]
site_name = "Codex"
site_url = "https://codex-comic-reader.readthedocs.io/"
site_author = "AJ"
site_description = "Codex Comicbook Reader Admin Guide"
nav = ["NEWS.md", "DOCKER.md"]
docs_dir = "docs"

[project.theme]
variant = "modern"
logo = "codex/img/logo.svg"
features = ["content.code.copy", "navigation.footer", "search.highlight"]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.palette]
scheme = "slate"
primary = "indigo"
accent = "orange"

[project.markdown_extensions]
smarty = {}
toc.permalink = true
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.quotes.callouts = true

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true
