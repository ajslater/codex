build:
  os: ubuntu-lts-latest
  tools:
    python: "3"
  jobs:
    install:
      - pip install uv
    build:
      html:
        - uv run --only-group docs --no-dev zensical build --strict
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html/"
      - cp --recursive site/* "$READTHEDOCS_OUTPUT/html/"
version: 2
