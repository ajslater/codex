name: CI container
description: >-
  Restore the codex-ci image from the GHCR registry cache, load it, and start
  the compose service "ci" (CI_IMAGE and CI_CONTAINER come from the workflow
  env).
inputs:
  image:
    description: The CI image name without a tag (the workflow's env.CI_IMAGE).
    required: true
  token:
    description: Token for logging in to GHCR.
    default: ${{ github.token }}
  write-cache:
    description: >-
      "true" exports the buildx cache to <image>:cache. Exactly one caller per
      run should write it.
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build dist-builder image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: codex-ci
        load: true
        # The tag compose.yaml's `image: ${CI_IMAGE}` resolves to.
        tags: ${{ inputs.image }}:latest
        cache-from: type=registry,ref=${{ inputs.image }}:cache
        # An empty cache-to exports nothing.
        cache-to: ${{ inputs.write-cache == 'true' && format('type=registry,ref={0}:cache,mode=max', inputs.image) || '' }}

    - name: Start Services
      shell: bash
      run: |
        mkdir -p dist test-results
        docker compose up -d ci
