# Managed by devenv (copy/ci). Edit it there, not in a child repo.
#
# A composite action, not a reusable workflow, so it can run in any job (for
# example straight after an image manifest) and so PyPI trusted publishing,
# which PyPI refuses from inside a reusable workflow, stays possible.
name: devenv PyPI publish
description: >-
  Publish the python-dist artifact to PyPI with uv. Files already on PyPI are
  skipped, so a re-run finishes a partial publish. Without a token it uses
  trusted publishing, so the job must grant id-token: write and must be a job
  in the repo's own ci.yml, which is the workflow registered on PyPI, not in a
  reusable workflow.
inputs:
  token:
    description: >-
      A PyPI API token (secrets.PYPI_TOKEN). Empty, as a deleted secret is,
      means trusted publishing.
    required: false
    default: ""
  download:
    description: >-
      "false" when the job has already downloaded python-dist into dist/.
    default: "true"
runs:
  using: composite
  steps:
    - name: Download dist artifact
      if: inputs.download == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-dist
        path: dist/

    - name: Set up uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: Publish to PyPI with a token
      if: inputs.token != ''
      shell: bash
      env:
        UV_PUBLISH_TOKEN: ${{ inputs.token }}
      run: uv publish --check-url https://pypi.org/simple/ dist/*

    # UV_PUBLISH_TOKEN stays unset: an empty one might count as a token.
    - name: Publish to PyPI with trusted publishing
      if: inputs.token == ''
      shell: bash
      run: >-
        uv publish --trusted-publishing always
        --check-url https://pypi.org/simple/ dist/*
